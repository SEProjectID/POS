name: Build APK 1Pro

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Alamat aplikasi di hosting (kosongkan = pakai app.config.json)"
        required: false
        default: ""
      release:
        description: "Bangun APK rilis yang ditandatangani (butuh secret keystore)"
        type: boolean
        default: false
      version_code:
        description: "Nomor versi (angka, naikkan tiap rilis baru)"
        required: false
        default: "1"
      version_name:
        description: "Nama versi"
        required: false
        default: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek
        id: prep
        run: |
          ZIP=""
          for z in 1Pro_Build.zip 1pro-app.zip meja-utama-app.zip; do
            if [ -f "$z" ]; then ZIP="$z"; break; fi
          done
          if [ -z "$ZIP" ]; then ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true); fi
          if [ -z "$ZIP" ]; then echo "Zip proyek tidak ditemukan di folder utama repo"; exit 1; fi
          echo "Memakai zip: $ZIP"
          rm -rf app && mkdir -p app && unzip -q -o "$ZIP" -d app
          PKG=$(find app -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1)
          if [ -z "$PKG" ]; then echo "package.json tidak ada di dalam $ZIP"; find app -maxdepth 2; exit 1; fi
          DIR=$(dirname "$PKG")
          echo "Folder proyek: $DIR"; ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Pasang dependensi
        working-directory: ${{ steps.prep.outputs.dir }}
        run: npm ci || npm install

      - name: Siapkan proyek Android (icon, izin Bluetooth, plugin printer)
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          APP_URL: ${{ inputs.app_url }}
        run: npm run setup

      - name: Keystore (hanya untuk rilis)
        if: ${{ inputs.release }}
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 belum diisi"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ steps.prep.outputs.dir }}/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 1Pro-APK
          path: ${{ steps.prep.outputs.dir }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
