name: Build APK Meja Utama

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Alamat aplikasi di hosting (kosongkan = pakai app.config.json)"
        required: false
        default: ""
      release:
        description: "Bangun APK rilis yang ditandatangani (butuh secret keystore)"
        type: boolean
        default: false
      version_code:
        description: "Nomor versi (angka, naikkan tiap rilis baru)"
        required: false
        default: "1"
      version_name:
        description: "Nama versi"
        required: false
        default: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Kalau Anda mengunggah meja-utama-app.zip ke repo (cara termudah dari iPad),
      # zip itu otomatis dibuka ke folder app/. Kalau tidak ada, repo dianggap
      # sudah berisi proyeknya langsung.
      - name: Siapkan proyek
        id: prep
        run: |
          if [ -f meja-utama-app.zip ]; then
            mkdir -p app && unzip -q -o meja-utama-app.zip -d app
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK sudah terpasang di mesin GitHub; cukup terima lisensinya.
      # (Gradle mengunduh komponen yang kurang secara otomatis.)
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Pasang dependensi
        working-directory: ${{ steps.prep.outputs.dir }}
        run: npm ci

      - name: Siapkan proyek Android (icon, izin Bluetooth, plugin printer)
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          APP_URL: ${{ inputs.app_url }}
        run: npm run setup

      - name: Keystore (hanya untuk rilis)
        if: ${{ inputs.release }}
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 belum diisi"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ steps.prep.outputs.dir }}/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MejaUtama-APK
          path: ${{ steps.prep.outputs.dir }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

